# Copy to config.toml, or start `uv run python -m auto_gbp` and save your settings.
# Omitted settings use CLI defaults. Real input is disabled for safety.
[settings]
title = "MuMu"
output_backend = "keyboard"
send_keys = false
key_log = false
region = "top"
no_preview = true
delay_ms = 350.0
green_holds = true
green_slides = true
flicks = true
timing_jitter = false

# Touch mode: fill in the tested instance, Android size and calibrated delay.
adb_path = "adb"
adb_serial = "127.0.0.1:5555"
touch_server = "tools/scrcpy-win64-v3.3.3/scrcpy-server"
touch_size = [1920, 1080]
touch_delay_ms = 0.0
touch_flick_duration_ms = 60.0
touch_flick_distance = 120.0
